name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Unit tests (stdlib only, no deps)
        run: python3 -m unittest discover -s tests -v
      - name: Frontend syntax checks
        run: |
          node --check web/app.js
          node --check web/network.js
      - name: Server smoke test
        run: |
          python3 server.py &
          sleep 2
          curl -sf http://127.0.0.1:8000/api/health
          curl -sf -XPOST http://127.0.0.1:8000/api/simulate \
            -H 'Content-Type: application/json' -d '{"duration_min":5}' > /dev/null
          echo "smoke ok"
